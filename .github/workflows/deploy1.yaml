name: Deployment

on:
  push:
    branches:
      - main
      - dev

env:
  MONGODB_DB_NAME: gha-demo
  MONGODB_CLUSTER_ADDRESS: goshenignite.g1ekm5d.mongodb.net
  MONGODB_USERNAME: rolandenoh
  MONGODB_PASSWORD: AcceptJesusNow
  PORT: 8080

jobs:
  test:
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT

      - name: Run tests
        run: npm test

      - name: Output information
        run: 'echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"'

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
          echo "MONGODB_CLUSTER_ADDRESS: ${{ env.MONGODB_CLUSTER_ADDRESS }}"